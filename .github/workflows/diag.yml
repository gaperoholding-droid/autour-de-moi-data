name: Diag parquet SIRENE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer duckdb
        run: pip install --quiet duckdb
      - name: Diagnostic
        run: |
          mkdir -p build
          python build/diag.py > build/_diag.txt 2>&1 || echo "EXIT NON ZERO" >> build/_diag.txt
      - name: Publier
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add build/_diag.txt
          git commit -m "Diag parquet" || echo "rien"
          git push || echo "push ko"
