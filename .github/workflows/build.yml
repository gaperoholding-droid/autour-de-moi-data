name: Génération mensuelle (SIRENE)

# SIRENE publie le 1er de chaque mois : on régénère le 2 à 03:00 UTC.
on:
  schedule:
    - cron: "0 3 2 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer DuckDB
        run: pip install --quiet duckdb
      - name: Générer la France entière
        env:
          DEP: "ALL"
          BUDGET_MIN: "320"
        run: python build/generer_national.py
      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publier:
    needs: generer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
