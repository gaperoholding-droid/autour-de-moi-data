name: Générer les annuaires (nuit)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer les annuaires
        env:
          SEUIL_POP: "10000"
          PAUSE: "1.2"
        run: python build/generer.py

      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publier:
    needs: generer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
