name: Calcul Metropole Saint-Etienne
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  calc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build/metropole_stetienne.py > build/_metropole_st.txt 2>&1 || true
      - run: cat build/_metropole_st.txt
      - run: |
          git config user.email contact@naemis.paris
          git config user.name placette
          git add build/_metropole_st.txt
          git commit -m "calcul metropole saint-etienne" || echo "rien"
          git push || echo "push ko"
