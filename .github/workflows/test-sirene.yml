name: Test SIRENE (une commune)

# Lancement manuel uniquement. Affiche le résultat dans les logs ET l'écrit
# dans build/_resultat_<code>.txt (committé) pour pouvoir le relire facilement.
on:
  workflow_dispatch:
    inputs:
      commune:
        description: "Code INSEE de la commune à tester"
        required: true
        default: "42222"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester la commune
        env:
          CODE_COMMUNE: ${{ github.event.inputs.commune }}
        run: python build/test_sirene.py
      - name: Publier le résultat dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add build/_resultat_*.txt build/_data_*.json || true
          git commit -m "Résultat test SIRENE ${{ github.event.inputs.commune }}" || echo "rien à committer"
          git push || echo "push impossible"
