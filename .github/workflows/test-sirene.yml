name: Test SIRENE (une commune)

# Lancement manuel uniquement. N'affecte pas le site : affiche le résultat dans les logs.
on:
  workflow_dispatch:
    inputs:
      commune:
        description: "Code INSEE de la commune à tester"
        required: true
        default: "42222"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester la commune
        env:
          CODE_COMMUNE: ${{ github.event.inputs.commune }}
        run: python build/test_sirene.py
