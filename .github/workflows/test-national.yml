name: Test national (un département)

on:
  workflow_dispatch:
    inputs:
      dep:
        description: "Département à tester (ex. 42), ou ALL"
        required: true
        default: "42"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer DuckDB
        run: pip install --quiet duckdb
      - name: Générer le département
        env:
          DEP: ${{ github.event.inputs.dep }}
        run: |
          mkdir -p build
          python build/generer_national.py > build/_national_log.txt 2>&1 || echo "EXIT NON ZERO" >> build/_national_log.txt
      - name: Publier log + témoins
        if: always()
        run: |
          mkdir -p build
          [ -f public/build.json ] && cp public/build.json build/_national_build.json || true
          [ -f public/c/42222.json ] && cp public/c/42222.json build/_national_42222.json || true
          [ -f public/c/42207.json ] && cp public/c/42207.json build/_national_42207.json || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add build/_national_log.txt
          [ -f build/_national_build.json ] && git add build/_national_build.json || true
          [ -f build/_national_42222.json ] && git add build/_national_42222.json || true
          [ -f build/_national_42207.json ] && git add build/_national_42207.json || true
          git commit -m "Test national dep ${{ github.event.inputs.dep }}" || echo "rien à committer"
          git push || echo "push impossible"
